name: Daily health check

# Runs every weekday at 11:55 UTC (7:55am ET) — well before the 9:30am open —
# plus on demand from the Actions tab. Opens a GitHub issue if anything fails,
# which emails you automatically.
on:
  schedule:
    - cron: "55 11 * * 1-5"
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  healthcheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run health check
        id: check
        run: |
          set -o pipefail
          python3 healthcheck.py ${APP_URL:+--url "$APP_URL"} 2>&1 | tee report.txt
        env:
          # Optional: set an APP_URL repository variable to also check the
          # deployed site (Settings -> Secrets and variables -> Actions -> Variables).
          APP_URL: ${{ vars.APP_URL }}

      - name: Open an issue if the check failed
        if: failure()
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            let report = 'Report unavailable.';
            try { report = fs.readFileSync('report.txt', 'utf8').slice(-5000); } catch {}
            const today = new Date().toISOString().slice(0, 10);
            await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: `Health check failed — ${today}`,
              labels: ['healthcheck'],
              body: [
                `The daily health check failed on ${today}.`,
                '',
                '```',
                report,
                '```',
                '',
                `[View the full run](${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId})`,
                '',
                'Common causes: Yahoo Finance rate-limiting or changing its API, an RSS feed',
                'going away, or the FOMC/CPI calendar needing next year\'s dates.',
              ].join('\n'),
            });

      - name: Upload report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: healthcheck-report
          path: report.txt
          retention-days: 14
