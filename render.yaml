# One-click deploy blueprint for https://render.com.
# In Render: New + -> Blueprint -> point it at this repository. It offers
# both services below; deploy the ones you want and delete the rest.
services:
  - type: web
    name: options-trading-assistant
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: APP_PASSWORD   # set a value in the Render dashboard to require a login password
        sync: false

  # Only Me & You — the couples' app, always on. Not on the free plan on
  # purpose: photos/voice/video/DB live on the mounted disk below, and disks
  # (a) require a paid instance and (b) are the only storage that survives a
  # deploy — on the free plan every restart would erase the memories.
  # ~$7/mo for the instance + $0.25/GB/mo for the disk. The disk can be
  # grown later in the dashboard; it cannot be shrunk.
  - type: web
    name: only-me-and-you
    runtime: python
    plan: starter
    buildCommand: pip install -r onlymeyou/requirements.txt
    startCommand: uvicorn onlymeyou.server:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /api/state
    disk:
      name: onlymeyou-data
      mountPath: /var/data
      sizeGB: 5
    envVars:
      - key: OMY_DATA_DIR   # point the app's world at the persistent disk
        value: /var/data
